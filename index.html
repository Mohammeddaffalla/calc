<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calculater">
      
        <input class="display" type="text" placeholder="0" id="display">
        
    <div class="row">
        <button onclick="clear_input()" style="background-color:#ff6700;color: aliceblue">AC</button>
        <button onclick="del_one()" style="background-color: rgb(153, 24, 24); color: aliceblue">Del</button>
        <button value="%" onclick="display(value)" style="color: rgb(24, 162, 144)">%</button>
        <button value="/" onclick="display(value)" style="color: rgb(24, 162, 144)">/</button>

    </div>
    <div class="row">
        <button value="7" onclick="display(value)">7</button>
        <button value="8" onclick="display(value)">8</button>
        <button value="9" onclick="display(value)">9</button>
        <button value="*" onclick="display(value)" style="color:rgb(24, 162, 144) ">*</button>

    </div>

     <div class="row">
        <button value="4" onclick="display(value)">4</button>
        <button value="5" onclick="display(value)">5</button>
        <button value="6" onclick="display(value)">6</button>
        <button value="-" onclick="display(value)" style="color:rgb(24, 162, 144)">-</button>

    </div>
     <div class="row">
        <button value="1" onclick="display(value)">1</button>
        <button value="2" onclick="display(value)">2</button>
        <button value="3" onclick="display(value)">3</button>
        <button value="+" onclick="display(value)" style="color:rgb(24, 162, 144)">+</button>

    </div>
    <div class="row">
        <button value="00" onclick="display(value)">00</button>
        <button value="0" onclick="display(value)">0</button>
        <button value="." onclick="display(value)">.</button>
        <button onclick="equal()" style="background-color:rgb(0, 174, 255,0.83); color:#fff;">=</button>

    </div>


</div>


<script src="main.js"></script>
</body>
</html>
